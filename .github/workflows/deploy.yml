name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r attribution_agent/attribution_agent/requirements.txt pytest

      - name: Run tests
        run: pytest attribution_agent/attribution_agent/tests/ -v --tb=short
        env:
          DATABRICKS_SERVER_HOSTNAME: mock
          DATABRICKS_HTTP_PATH: mock
          DATABRICKS_TOKEN: mock
          ANTHROPIC_API_KEY: mock

      # TODO: Cloud Run CD — authenticate via Workload Identity Federation,
      # then `gcloud builds submit` + `gcloud run jobs deploy` + `gcloud run
      # deploy` (see deploy.sh). Until then, deploys run manually: ./deploy.sh

      - name: Notify success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ *Attribution Agent main is green* — deploy with ./deploy.sh%0ASha: \`${{ github.sha }}\`" \
            -d parse_mode=Markdown

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ *Attribution Agent deploy FAILED*%0ASha: \`${{ github.sha }}\`%0ASee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d parse_mode=Markdown
