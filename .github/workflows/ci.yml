name: CI

# push is limited to main so PR commits run CI once (via pull_request), not
# twice — the ~57-min test job doubled the Actions bill on every PR push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.15.19
      - name: Check formatting
        run: ruff format --check attribution_agent/attribution_agent/
      - name: Check linting
        run: ruff check attribution_agent/attribution_agent/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r attribution_agent/attribution_agent/requirements.txt pytest
      - name: Run tests
        run: pytest attribution_agent/attribution_agent/tests/ -v --tb=short
        env:
          DATABRICKS_SERVER_HOSTNAME: mock
          DATABRICKS_HTTP_PATH: mock
          DATABRICKS_TOKEN: mock
          ANTHROPIC_API_KEY: mock

  eval-gate:
    name: Eval Gate
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect AI behavior changes
        id: ai-changes
        shell: bash
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | \
            grep -Eq '^(\.claude/agents/|attribution_agent/attribution_agent/(utils/model_gateway.py|agents/(insight|intelligence)/|evals/))'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.ai-changes.outputs.run == 'true'
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: steps.ai-changes.outputs.run == 'true'
        run: pip install -r attribution_agent/attribution_agent/requirements.txt
      - name: Run eval gate
        if: steps.ai-changes.outputs.run == 'true'
        run: >-
          python attribution_agent/attribution_agent/evals/eval_runner.py
          --seed-file attribution_agent/attribution_agent/evals/seeds/multichannel_reporting.json
          --all-agents --ci-mode --require-samples
        env:
          DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
