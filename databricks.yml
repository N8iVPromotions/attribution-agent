bundle:
  name: attribution-agent

workspace:
  host: https://8259555645755006.6.gcp.databricks.com

targets:
  production:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Users/zajen@n8ivpromotions.com/.bundle/${bundle.name}/${bundle.target}

resources:

  # ── Scheduled Job (serverless compute) ───────────────────────────────────────
  jobs:
    attribution_pipeline:
      name: "[Attribution] Monthly Pipeline"
      description: >
        Runs the full attribution pipeline for every agency:
        ingest Meta/HubSpot/Stripe → generate AI report → send white-labeled email.

      schedule:
        quartz_cron_expression: "0 0 9 1 * ?"   # 9 AM UTC on the 1st of each month
        timezone_id: "America/New_York"
        pause_status: UNPAUSED

      tasks:
        - task_key: run_all_agencies
          spark_python_task:
            python_file: attribution_agent/attribution_agent/flows/agency_flow.py
            # No --agency arg → runs all agencies via run_all_agencies()
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - "requests>=2.31.0"
              - "hubspot-api-client>=8.1.0"
              - "pandas>=2.0.0"
              - "python-dotenv>=1.0.0"
              - "tenacity>=8.2.0"
              - "loguru>=0.7.0"
              - "stripe>=7.0.0"
              - "google-ads>=24.0.0"
              - "anthropic>=0.97.0"
              - "databricks-sdk>=0.28.0"

      email_notifications:
        on_failure:
          - zajen@n8ivpromotions.com
        on_success:
          - zajen@n8ivpromotions.com

      timeout_seconds: 3600

  # ── Streamlit App ────────────────────────────────────────────────────────────
  apps:
    attribution_ui:
      name: attribution-pipeline-ui
      description: "Streamlit UI for triggering and monitoring the attribution pipeline"
      source_code_path: attribution_agent/attribution_agent

      config:
        command:
          - python
          - startup.py
        env:
          - name: ATTRIBUTION_JOB_NAME
            value: "[Attribution] Monthly Pipeline"
          - name: ATTRIBUTION_JOB_ID
            value: "500226442246561"
          # Secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, OPENAI_API_KEY, etc.)
          # are read at runtime via WorkspaceClient().secrets.get_secret()
          # in app.py:_get_secret(). Managed in the "attribution" secret scope.
