bundle:
  name: attribution-agent

workspace:
  host: https://8259555645755006.6.gcp.databricks.com

targets:
  production:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Users/zajen@n8ivpromotions.com/.bundle/${bundle.name}/${bundle.target}

resources:

  # ── Scheduled Job (serverless compute) ───────────────────────────────────────
  jobs:
    attribution_pipeline:
      name: "[Attribution] Monthly Pipeline"
      description: >
        Runs the full attribution pipeline for every agency:
        ingest Meta/HubSpot/Stripe → generate AI report → send white-labeled email.

      schedule:
        quartz_cron_expression: "0 0 9 1 * ?"   # 9 AM UTC on the 1st of each month
        timezone_id: "America/New_York"
        pause_status: UNPAUSED

      job_clusters: []

      tasks:
        - task_key: run_all_agencies
          spark_python_task:
            python_file: attribution_agent/attribution_agent/flows/agency_flow.py
          environment_key: default

      parameters:
        - name: agency
          default: ""
        - name: dry_run
          default: "false"
        - name: attribution_model
          default: "last_touch"

      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              # The workspace default pip index points at a GCP Artifact Registry
              # mirror (us-central1-python.pkg.dev) that serverless egress cannot
              # resolve since ~2026-07-01; public PyPI IS reachable, so override.
              - "--index-url https://pypi.org/simple"
              - "requests>=2.31.0"
              - "hubspot-api-client>=8.1.0"
              # pandas 3 removed pd.Timestamp.utcnow(), which the writers use;
              # client "3" is Python 3.12 where pandas>=2 would resolve to 3.x.
              - "pandas>=2.0.0,<3.0.0"
              - "python-dotenv>=1.0.0"
              - "tenacity>=8.2.0"
              - "loguru>=0.7.0"
              - "stripe>=7.0.0"
              - "sendgrid>=6.11.0"
              - "google-ads>=24.0.0"
              - "anthropic>=0.97.0"
              - "databricks-sdk>=0.28.0"
              # databricks-connect intentionally NOT listed: serverless preinstalls
              # the version matched to the environment; installing a newer one
              # over it breaks environment resolution.

      email_notifications:
        on_failure:
          - zajen@n8ivpromotions.com
        on_success:
          - zajen@n8ivpromotions.com

      permissions:
        - level: CAN_MANAGE_RUN
          service_principal_name: b94ef94a-c5cd-4964-9c85-808c070be27f

      timeout_seconds: 3600

  # ── Streamlit App ────────────────────────────────────────────────────────────
  apps:
    attribution_ui:
      name: attribution-pipeline-ui
      description: "Streamlit UI for triggering and monitoring the attribution pipeline"
      source_code_path: attribution_agent/attribution_agent

      config:
        command:
          - streamlit
          - run
          - app.py
          - "--server.port"
          - "8080"
          - "--server.headless"
          - "true"
        env:
          - name: ATTRIBUTION_JOB_ID
            value: "500226442246561"
          - name: ATTRIBUTION_CATALOG
            value: "workspace"
          - name: ATTRIBUTION_OPS_SCHEMA
            value: "workspace.attribution_ops"
          - name: COMMS_PROVIDER
            value: "gmail"
          # Client registry stored on a Volume so it persists across App restarts.
          # Create the Volume first: workspace > attribution_ops > client_registry (Volume).
          - name: ATTRIBUTION_CLIENT_REGISTRY_PATH
            value: "/Volumes/workspace/attribution_ops/client_registry/clients.json"
          # Agent prompt files — resolved at runtime inside the App container.
          - name: N8IV_AGENTS_DIR
            value: "/home/user/.bundle/attribution-agent/production/.claude/agents"
          # All other secrets (API keys, Telegram, email) live in the "attribution"
          # Databricks secret scope and are read via WorkspaceClient().secrets.get_secret().
